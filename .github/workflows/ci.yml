name: CI

# SERBITO-400: the PR gate for Dependabot auto-merge (dependabot-automerge.yml).
# The same checks as scripts/release_minor.sh: npm test, typecheck, build.
# Pull requests and pushes to main (SERBITO-613): scripts/ci_gate.sh refuses a release unless
# this run is green for the released commit, and ci-red.yml opens a Jira issue when it is red.
# deploy.yml runs on tags. Dependabot PRs get no repo secrets, and this job uses none.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR (or to main) cancels the old run of that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout runs `git init`; with no default branch configured, git prints a
  # multi-line "Using 'master'" hint into the log. Set it for every git call (zero-noise logs).
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    runs-on: ubuntu-24.04 # explicit: ubuntu-latest moves to 26.04 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config
          fetch-depth: 0 # the sitemap and changelog scripts read the git history and tags

      # One Node for the image and the tests: the major from the Dockerfile's FROM lines,
      # which Dependabot bumps.
      - name: Node version from Dockerfile
        id: node
        run: |
          version="$(sed -nE 's#^FROM node:([0-9]+)-slim AS build$#\1#p' Dockerfile)"
          if [ -z "$version" ]; then echo "::error file=Dockerfile::FROM node:N-slim AS build not found"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0 (SHA-pinned)
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci
      # SERBITO-613: a known high or critical advisory in any dependency fails the run.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      # server/test drives Chromium through playwright-core (consent_focus uses full Chromium).
      - name: Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium

      # SERBITO-613: warnings are failures. A Node deprecation warning throws (tests, typecheck,
      # build); the client and server builds fail on any bundler warning themselves.
      - name: npm test
        run: npm test
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: npm run typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --throw-deprecation
      - name: npm run build
        run: npm run build
        env:
          NODE_OPTIONS: --throw-deprecation
      # Dockerfile build checks (lint) without building the image: the Dockerfile sets
      # `check=error=true`, so any check warning fails the PR, not the release.
      - name: Dockerfile build checks
        run: docker build --check .
